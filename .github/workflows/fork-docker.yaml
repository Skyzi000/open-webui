# Fork-only image publisher. The upstream workflows (docker.yaml, release.yml,
# release-pypi.yml, backend.yaml, frontend.yaml) are disabled in this repository's
# Actions settings, not deleted, so upstream merges never conflict here.
# GHCR creates the package private on first push; switch it to public once by hand.
name: Build fork image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['fork-v*']

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/skyzi000/open-webui

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # Same as upstream docker.yaml: the frontend build needs a larger Node heap on hosted runners.
      - name: Prepare CI Dockerfile
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          build-args: BUILD_HASH=${{ github.sha }}
